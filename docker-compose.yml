services:
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  ollama-pull-model:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command: -c "sleep 10 && ollama pull qwen2.5-coder && echo 'Modello qwen scaricato con successo!'"

  app:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./data/uploaded_dbs:/app/data/uploaded_dbs

  demo-app:
    build: .
    restart: always
    ports:
      - "8001:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - SQLITE_PATH=/app/demo/baseball_1.sqlite
    command: ["uvicorn", "demo.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data: